<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mekelle Digital Cafe - QR Menu</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; color: #1c1e21; }
        header { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=500&q=80'); background-size: cover; color: white; padding: 40px 20px; text-align: center; border-radius: 0 0 25px 25px; }
        .container { width: 92%; max-width: 480px; margin: -20px auto 30px; }
        
        .lang-switcher { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .lang-btn { background: white; border: 1px solid #ddd; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: 0.3s; }
        .lang-btn.active { background: #1c1e21; color: white; border-color: #1c1e21; }

        .search-box { width: 100%; padding: 15px 25px; border: none; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 1rem; margin-bottom: 20px; outline: none; box-sizing: border-box; }
        .special-banner { background: linear-gradient(45deg, #ff416c, #ff4b2b); color: white; padding: 20px; border-radius: 15px; margin-bottom: 25px; text-align: center; box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4); }
        .category-group { margin-bottom: 20px; }
        .category-header { font-size: 1.4rem; font-weight: bold; margin: 25px 0 15px; text-align: center; color: #ffffff; padding: 10px; border-radius: 50px; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
        .menu-item { background: white; padding: 16px; margin-bottom: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .item-info { display: flex; align-items: center; gap: 10px; }
        .item-text { font-weight: 600; font-size: 1rem; }
        .price { color: #27ae60; font-weight: bold; background: #e8f5e9; padding: 5px 12px; border-radius: 20px; font-size: 0.9rem; white-space: nowrap; }
        .waiter-btn { width: 100%; background: #1c1e21; color: white; border: none; padding: 18px; border-radius: 15px; font-size: 1.1rem; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h1>🍽️ Mekelle Digital Cafe</h1>
    <p id="sub-header">Premium Digital Experience</p>
</header>

<div class="container">
    <div class="lang-switcher">
        <button id="btn-en" class="lang-btn active" onclick="setLang('en', this)">English</button>
        <button id="btn-ti" class="lang-btn" onclick="setLang('ti', this)">ትግርኛ</button>
        <button id="btn-am" class="lang-btn" onclick="setLang('am', this)">አማርኛ</button>
    </div>

    <input type="text" id="menuSearch" class="search-box" placeholder="🔍 Search for food or drinks..." onkeyup="searchMenu()">

    <div id="specialSection" class="special-banner">
        <h2 id="special-title" style="margin:0">⭐ Today’s Special</h2>
        <p id="special-desc" style="font-size: 1.1rem; margin: 10px 0 0;">Burger + Juice — 150 ETB</p>
    </div>

    <div class="category-group">
        <div class="category-header" id="head-breakfast" style="background: #e67e22;">🍳 Breakfast</div>
        <div class="menu-item"><div class="item-info"><span>🍳</span><span class="item-text" data-key="eggs">Eggs</span></div><span class="price">50 ETB</span></div>
        <div class="menu-item"><div class="item-info"><span>🥞</span><span class="item-text" data-key="pancake">Pancake</span></div><span class="price">70 ETB</span></div>
    </div>

    <div class="category-group">
        <div class="category-header" id="head-fastfood" style="background: #e74c3c;">🍔 Fast Food</div>
        <div class="menu-item"><div class="item-info"><span>🍔</span><span class="item-text" data-key="burger">Burger</span></div><span class="price">120 ETB</span></div>
        <div class="menu-item"><div class="item-info"><span>🍟</span><span class="item-text" data-key="fries">French Fries</span></div><span class="price">80 ETB</span></div>
    </div>

    <div class="category-group">
        <div class="category-header" id="head-soft" style="background: #3498db;">🥤 Soft Drinks</div>
        <div class="menu-item"><div class="item-info"><span>🥤</span><span class="item-text" data-key="coke">Coca-Cola</span></div><span class="price">30 ETB</span></div>
    </div>

    <button id="waiter-button" class="waiter-btn" onclick="alert('Staff notified!')">📞 Call Waiter</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>
    // 1. Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyAJNjWNONdO1H54HzjCG8nmEjFWkYeRZCE",
        authDomain: "mekelle-cafe-menu.firebaseapp.com",
        databaseURL: "https://mekelle-cafe-menu-default-rtdb.firebaseio.com",
        projectId: "mekelle-cafe-menu",
        storageBucket: "mekelle-cafe-menu.firebasestorage.app",
        messagingSenderId: "494158082943",
        appId: "1:494158082943:web:bc322aad261a11a247e04a",
        measurementId: "G-5LSSVHCREY"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. Global Variables
    let currentLivePrice = "150"; 
    let currentLang = "en";

    const langData = {
        en: { sub: "Premium Digital Experience", search: "🔍 Search...", specialT: "⭐ Today’s Special", specialD: "Burger + Juice — ", waiter: "📞 Call Waiter", bfast: "🍳 Breakfast", fastfood: "🍔 Fast Food", soft: "🥤 Soft Drinks", eggs: "Eggs", pancake: "Pancake", burger: "Burger", fries: "French Fries", coke: "Coca-Cola" },
        ti: { sub: "ብሉጽ ዲጂታል ኣገልግሎት", search: "🔍 ምግቢ ድለዩ...", specialT: "⭐ ናይ ሎሚ ፍሉይ", specialD: "በርገር + ጁስ — ", waiter: "📞 ተቐባሊ ጸውዕ", bfast: "🍳 ቁርሲ", fastfood: "🍔 ቅልጡፍ ምግቢ", soft: "🥤 ልስሉስ መስተ", eggs: "እንቁላሊሕ", pancake: "ፓንኬክ", burger: "በርገር", fries: "ቺፕስ", coke: "ኮካ ኮላ" },
        am: { sub: "ምርጥ የዲጂታል አገልግሎት", search: "🔍 ምግብ ይፈልጉ...", specialT: "⭐ የዛሬ ልዩ", specialD: "በርገር + ጁስ — ", waiter: "📞 አስተናጋጅ ጥራ", bfast: "🍳 ቁርስ", fastfood: "🍔 ፈጣን ምግብ", soft: "🥤 ለስላሳ መጠጦች", eggs: "እንቁላል", pancake: "ፓንኬክ", burger: "በርገር", fries: "ቺፕስ", coke: "ኮካ ኮላ" }
    };

    // 3. Realtime Listener
    db.ref('burger_price').on('value', (snapshot) => {
        const price = snapshot.val();
        if (price) {
            currentLivePrice = price; // Update price from Firebase
            updateSpecialText(); 
        }
    });

    function updateSpecialText() {
        // Combines the language-specific prefix with the live price
        const prefix = langData[currentLang].specialD;
        document.getElementById('special-desc').innerText = `${prefix}${currentLivePrice} ETB`;
    }

    function setLang(lang, btn) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Update basic text
        document.getElementById('sub-header').innerText = langData[lang].sub;
        document.getElementById('menuSearch').placeholder = langData[lang].search;
        document.getElementById('special-title').innerText = langData[lang].specialT;
        document.getElementById('waiter-button').innerText = langData[lang].waiter;
        document.getElementById('head-breakfast').innerText = langData[lang].bfast;
        document.getElementById('head-fastfood').innerText = langData[lang].fastfood;
        document.getElementById('head-soft').innerText = langData[lang].soft;

        // Update the Live Special Banner
        updateSpecialText();

        document.querySelectorAll('[data-key]').forEach(item => {
            item.innerText = langData[lang][item.getAttribute('data-key')];
        });
    }

    function searchMenu() {
        let input = document.getElementById('menuSearch').value.toLowerCase();
        let groups = document.getElementsByClassName('category-group');
        let special = document.getElementById('specialSection');
        special.style.display = input === "" ? "block" : "none";
        for (let i = 0; i < groups.length; i++) {
            let items = groups[i].getElementsByClassName('menu-item');
            let hasMatch = false;
            for (let j = 0; j < items.length; j++) {
                if (items[j].innerText.toLowerCase().includes(input)) {
                    items[j].style.display = "flex";
                    hasMatch = true;
                } else {
                    items[j].style.display = "none";
                }
            }
            groups[i].style.display = hasMatch ? "block" : "none";
        }
    }
</script>

</body>
</html>
