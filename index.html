<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mekelle Digital Cafe - Dynamic Menu</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f7f6; color: #333; }
        header { background: #1c1e21; color: white; padding: 40px 20px; text-align: center; border-radius: 0 0 25px 25px; }
        .container { width: 92%; max-width: 500px; margin: 20px auto; }
        
        /* Category Styling */
        .category-section { margin-bottom: 30px; }
        .category-title { 
            background: #e74c3c; color: white; padding: 10px 20px; 
            border-radius: 50px; font-weight: bold; margin-bottom: 15px;
            display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Menu Item Styling */
        .menu-item { 
            background: white; padding: 15px; margin-bottom: 10px; 
            border-radius: 15px; display: flex; justify-content: space-between; 
            align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .menu-item:active { transform: scale(0.98); }
        .item-details { display: flex; align-items: center; gap: 12px; }
        .item-icon { font-size: 1.5rem; }
        .item-name { font-weight: 600; font-size: 1.1rem; }
        .price-tag { 
            color: #27ae60; font-weight: 800; background: #e8f5e9; 
            padding: 6px 15px; border-radius: 20px; font-size: 0.95rem; 
        }

        .loading-spinner { text-align: center; margin-top: 50px; color: #888; font-style: italic; }
    </style>
</head>
<body>

<header>
    <h1>🍽️ Mekelle Digital Cafe</h1>
    <p>Real-Time Menu Management</p>
</header>

<div class="container" id="menu-root">
    <div class="loading-spinner">Fetching latest menu from database...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>
    // 1. Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAJNjWNONdO1H54HzjCG8nmEjFWkYeRZCE",
        authDomain: "mekelle-cafe-menu.firebaseapp.com",
        databaseURL: "https://mekelle-cafe-menu-default-rtdb.firebaseio.com",
        projectId: "mekelle-cafe-menu",
        storageBucket: "mekelle-cafe-menu.firebasestorage.app",
        appId: "1:494158082943:web:bc322aad261a11a247e04a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. Fetch and Build Menu
    db.ref('menu_items').on('value', (snapshot) => {
        const root = document.getElementById('menu-root');
        root.innerHTML = ''; // Clear loading message
        
        const data = snapshot.val();
        if (!data) {
            root.innerHTML = '<p style="text-align:center">Menu is currently empty. Add items in Firebase!</p>';
            return;
        }

        // Group items by category automatically
        const categories = {};
        for (let id in data) {
            const item = data[id];
            const cat = item.category || "General";
            if (!categories[cat]) categories[cat] = [];
            categories[cat].push(item);
        }

        // Generate HTML for each category and item
        for (let catName in categories) {
            const section = document.createElement('div');
            section.className = 'category-section';
            
            let itemsHtml = `<div class="category-title">${catName}</div>`;
            
            categories[catName].forEach(item => {
                itemsHtml += `
                    <div class="menu-item">
                        <div class="item-details">
                            <span class="item-icon">${item.icon || '🍴'}</span>
                            <span class="item-name">${item.name}</span>
                        </div>
                        <span class="price-tag">${item.price} ETB</span>
                    </div>
                `;
            });
            
            section.innerHTML = itemsHtml;
            root.appendChild(section);
        }
    });
</script>
</body>
</html>
