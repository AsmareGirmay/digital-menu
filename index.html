<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mekelle Digital Cafe - QR Menu</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; color: #1c1e21; }
        header { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=500&q=80'); background-size: cover; color: white; padding: 30px 20px; text-align: center; border-radius: 0 0 25px 25px; }
        .container { width: 92%; max-width: 480px; margin: -20px auto 30px; }
        
        /* 🌍 Language Switcher Style */
        .lang-switcher { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .lang-btn { background: white; border: 1px solid #ddd; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.3s; }
        .lang-btn.active { background: #2c3e50; color: white; border-color: #2c3e50; }

        .search-box { width: 100%; padding: 15px 25px; border: none; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 1rem; margin-bottom: 20px; outline: none; box-sizing: border-box; }
        .special-banner { background: linear-gradient(45deg, #ff416c, #ff4b2b); color: white; padding: 20px; border-radius: 15px; margin-bottom: 25px; text-align: center; }
        
        .category-group { margin-bottom: 20px; }
        .category-header { font-size: 1.4rem; font-weight: bold; margin: 25px 0 15px; text-align: center; color: #ffffff; padding: 10px; border-radius: 50px; }
        
        .menu-item { background: white; padding: 16px; margin-bottom: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .item-text { font-weight: 600; font-size: 1rem; }
        .price { color: #27ae60; font-weight: bold; background: #e8f5e9; padding: 5px 12px; border-radius: 20px; }
        .waiter-btn { width: 100%; background: #1c1e21; color: white; border: none; padding: 18px; border-radius: 15px; font-size: 1.1rem; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h1 id="cafeName">🍽️ Mekelle Digital Cafe</h1>
    <p id="welcomeMsg">Premium Digital Experience</p>
</header>

<div class="container">
    <!-- Language Buttons -->
    <div class="lang-switcher">
        <button class="lang-btn active" onclick="changeLang('en', this)">English</button>
        <button class="lang-btn" onclick="changeLang('ti', this)">ትግርኛ</button>
        <button class="lang-btn" onclick="changeLang('am', this)">አማርኛ</button>
    </div>

    <input type="text" id="menuSearch" class="search-box" placeholder="🔍 Search..." onkeyup="searchMenu()">

    <div id="specialSection" class="special-banner">
        <h2 id="todaySpecialTitle">⭐ Today’s Special</h2>
        <p id="todaySpecialItem">Burger + Juice — 150 ETB</p>
    </div>

    <!-- Breakfast -->
    <div class="category-group">
        <div class="category-header" id="cat-breakfast" style="background: #e67e22;">🍳 Breakfast</div>
        <div class="menu-item"><span class="item-text" data-key="eggs">🍳 Eggs</span><span class="price">50 ETB</span></div>
        <div class="menu-item"><span class="item-text" data-key="pancake">🥞 Pancake</span><span class="price">70 ETB</span></div>
    </div>

    <!-- Fast Food -->
    <div class="category-group">
        <div class="category-header" id="cat-fastfood" style="background: #e74c3c;">🍔 Fast Food</div>
        <div class="menu-item"><span class="item-text" data-key="burger">🍔 Burger</span><span class="price">120 ETB</span></div>
        <div class="menu-item"><span class="item-text" data-key="pizza">🍕 Pizza</span><span class="price">150 ETB</span></div>
    </div>

    <!-- Hot Beverages -->
    <div class="category-group">
        <div class="category-header" id="cat-drinks" style="background: #7f8c8d;">☕ Hot Beverages</div>
        <div class="menu-item"><span class="item-text" data-key="coffee">☕ Coffee</span><span class="price">30 ETB</span></div>
        <div class="menu-item"><span class="item-text" data-key="tea">🍵 Tea</span><span class="price">20 ETB</span></div>
    </div>

    <button class="waiter-btn" id="waiterBtn" onclick="alert('Staff notified!')">📞 Call Waiter</button>
</div>

<script>
    // 📚 Translation Data
    const translations = {
        en: {
            welcome: "Premium Digital Experience",
            search: "🔍 Search for food or drinks...",
            specialTitle: "⭐ Today’s Special",
            specialItem: "Burger + Juice — 150 ETB",
            waiter: "📞 Call Waiter",
            catBreakfast: "🍳 Breakfast",
            catFastFood: "🍔 Fast Food",
            catDrinks: "☕ Hot Beverages",
            eggs: "🍳 Eggs", pancake: "🥞 Pancake", burger: "🍔 Burger", pizza: "🍕 Pizza", coffee: "☕ Coffee", tea: "🍵 Tea"
        },
        ti: {
            welcome: "ብሉጽ ዲጂታል ኣገልግሎት",
            search: "🔍 ምግቢ ወይ መስተ ድለዩ...",
            specialTitle: "⭐ ናይ ሎሚ ፍሉይ",
            specialItem: "በርገር + ጁስ — 150 ብር",
            waiter: "📞 ተቐባሊ ጸውዕ",
            catBreakfast: "🍳 ቁርሲ",
            catFastFood: "🍔 ቅልጡፍ ምግቢ",
            catDrinks: "☕ ውዑይ መስተ",
            eggs: "🍳 እንቁላሊት", pancake: "🥞 ፓንኬክ", burger: "🍔 በርገር", pizza: "🍕 ፒዛ", coffee: "☕ ቡን", tea: "🍵 ሻሂ"
        },
        am: {
            welcome: "ምርጥ የዲጂታል አገልግሎት",
            search: "🔍 ምግብ ወይም መጠጥ ይፈልጉ...",
            specialTitle: "⭐ የዛሬ ልዩ",
            specialItem: "በርገር + ጁስ — 150 ብር",
            waiter: "📞 አስተናጋጅ ጥራ",
            catBreakfast: "🍳 ቁርስ",
            catFastFood: "🍔 ፈጣን ምግብ",
            catDrinks: "☕ ትኩስ መጠጦች",
            eggs: "🍳 እንቁላል", pancake: "🥞 ፓንኬክ", burger: "🍔 በርገር", pizza: "🍕 ፒዛ", coffee: "☕ ቡና", tea: "🍵 ሻይ"
        }
    };

    function changeLang(lang, btn) {
        // Update Buttons UI
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Update Text Content
        document.getElementById('welcomeMsg').innerText = translations[lang].welcome;
        document.getElementById('menuSearch').placeholder = translations[lang].search;
        document.getElementById('todaySpecialTitle').innerText = translations[lang].specialTitle;
        document.getElementById('todaySpecialItem').innerText = translations[lang].specialItem;
        document.getElementById('waiterBtn').innerText = translations[lang].waiter;
        document.getElementById('cat-breakfast').innerText = translations[lang].catBreakfast;
        document.getElementById('cat-fastfood').innerText = translations[lang].catFastFood;
        document.getElementById('cat-drinks').innerText = translations[lang].catDrinks;

        // Update Menu Items
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.getAttribute('data-key');
            el.innerText = translations[lang][key];
        });
    }

    function searchMenu() {
        let input = document.getElementById('menuSearch').value.toLowerCase();
        let groups = document.getElementsByClassName('category-group');
        let special = document.getElementById('specialSection');
        special.style.display = input === "" ? "block" : "none";
        for (let i = 0; i < groups.length; i++) {
            let items = groups[i].getElementsByClassName('menu-item');
            let hasMatch = false;
            for (let j = 0; j < items.length; j++) {
                if (items[j].innerText.toLowerCase().includes(input)) {
                    items[j].style.display = "flex";
                    hasMatch = true;
                } else {
                    items[j].style.display = "none";
                }
            }
            groups[i].style.display = hasMatch ? "block" : "none";
        }
    }
</script>

</body>
</html>
