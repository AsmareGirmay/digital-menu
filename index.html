<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mekelle Digital Cafe - QR Menu</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; color: #1c1e21; }
        header { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=500&q=80'); background-size: cover; color: white; padding: 40px 20px; text-align: center; border-radius: 0 0 25px 25px; }
        .container { width: 92%; max-width: 480px; margin: -20px auto 30px; }
        .lang-switcher { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .lang-btn { background: white; border: 1px solid #ddd; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: 0.3s; }
        .lang-btn.active { background: #1c1e21; color: white; border-color: #1c1e21; }
        .search-box { width: 100%; padding: 15px 25px; border: none; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 1rem; margin-bottom: 20px; outline: none; box-sizing: border-box; }
        .special-banner { background: linear-gradient(45deg, #ff416c, #ff4b2b); color: white; padding: 20px; border-radius: 15px; margin-bottom: 25px; text-align: center; box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4); }
        .category-group { margin-bottom: 20px; }
        .category-header { font-size: 1.4rem; font-weight: bold; margin: 25px 0 15px; text-align: center; color: #ffffff; padding: 10px; border-radius: 50px; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
        .menu-item { background: white; padding: 16px; margin-bottom: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .item-info { display: flex; align-items: center; gap: 10px; }
        .item-text { font-weight: 600; font-size: 1rem; }
        .price { color: #27ae60; font-weight: bold; background: #e8f5e9; padding: 5px 12px; border-radius: 20px; font-size: 0.9rem; white-space: nowrap; }
        .waiter-btn { width: 100%; background: #1c1e21; color: white; border: none; padding: 18px; border-radius: 15px; font-size: 1.1rem; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h1>🍽️ Mekelle Digital Cafe</h1>
    <p id="sub-header">Premium Digital Experience</p>
</header>

<div class="container">
    <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLang('en', this)">English</button>
        <button class="lang-btn" onclick="setLang('ti', this)">ትግርኛ</button>
        <button class="lang-btn" onclick="setLang('am', this)">አማርኛ</button>
    </div>

    <input type="text" id="menuSearch" class="search-box" placeholder="🔍 Search..." onkeyup="searchMenu()">

    <div id="specialSection" class="special-banner">
        <h2 id="special-title">⭐ Today’s Special</h2>
        <p id="special-desc">Burger + Juice — 150 ETB</p>
    </div>

    <div class="category-group">
        <div class="category-header" id="head-breakfast" style="background: #e67e22;">🍳 Breakfast</div>
        <div class="menu-item"><div class="item-info"><span>🍳</span><span class="item-text" data-key="eggs">Eggs</span></div><span class="price" id="p-eggs">50 ETB</span></div>
        <div class="menu-item"><div class="item-info"><span>🥞</span><span class="item-text" data-key="pancake">Pancake</span></div><span class="price" id="p-pancake">70 ETB</span></div>
    </div>

    <div class="category-group">
        <div class="category-header" id="head-fastfood" style="background: #e74c3c;">🍔 Fast Food</div>
        <div class="menu-item"><div class="item-info"><span>🍔</span><span class="item-text" data-key="burger">Burger</span></div><span class="price" id="p-burger">120 ETB</span></div>
        <div class="menu-item"><div class="item-info"><span>🍕</span><span class="item-text" data-key="pizza">Pizza</span></div><span class="price" id="p-pizza">150 ETB</span></div>
    </div>

    <div class="category-group">
        <div class="category-header" id="head-soft" style="background: #3498db;">🥤 Soft Drinks</div>
        <div class="menu-item"><div class="item-info"><span>🥤</span><span class="item-text" data-key="coke">Coca-Cola</span></div><span class="price" id="p-coke">30 ETB</span></div>
    </div>

    <button id="waiter-button" class="waiter-btn" onclick="alert('Staff notified!')">📞 Call Waiter</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAJNjWNONdO1H54HzjCG8nmEjFWkYeRZCE",
        authDomain: "mekelle-cafe-menu.firebaseapp.com",
        databaseURL: "https://mekelle-cafe-menu-default-rtdb.firebaseio.com",
        projectId: "mekelle-cafe-menu",
        storageBucket: "mekelle-cafe-menu.firebasestorage.app",
        appId: "1:494158082943:web:bc322aad261a11a247e04a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentLivePrice = "150";
    let currentLang = "en";

    // 1. Automatic Listeners for ALL IDs
    const itemsToTrack = [
        { key: 'burger_price', id: 'special-desc', isSpecial: true },
        { key: 'price_eggs', id: 'p-eggs' },
        { key: 'price_pancake', id: 'p-pancake' },
        { key: 'price_burger', id: 'p-burger' },
        { key: 'price_pizza', id: 'p-pizza' },
        { key: 'price_coke', id: 'p-coke' }
    ];

    itemsToTrack.forEach(item => {
        db.ref(item.key).on('value', (snapshot) => {
            const val = snapshot.val();
            if (val) {
                if (item.isSpecial) {
                    currentLivePrice = val;
                    updateSpecialUI();
                } else {
                    document.getElementById(item.id).innerText = val + " ETB";
                }
            }
        });
    });

    function updateSpecialUI() {
        const prefix = currentLang === 'am' ? "በርገር + ጁስ — " : (currentLang === 'ti' ? "በርገር + ጁስ — " : "Burger + Juice — ");
        document.getElementById('special-desc').innerText = prefix + currentLivePrice + " ETB";
    }

    // Language logic (simplified for brevity)
    function setLang(lang, btn) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateSpecialUI();
        // (Add your other langData updates here as per previous versions)
    }

    function searchMenu() {
        let input = document.getElementById('menuSearch').value.toLowerCase();
        let items = document.getElementsByClassName('menu-item');
        for (let item of items) {
            item.style.display = item.innerText.toLowerCase().includes(input) ? "flex" : "none";
        }
    }
</script>
</body>
</html>
